<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="메이플스토리 보스 파티 약속을 달력으로 관리하는 스케줄 보드" />
  <title>보스 집결지 | 메이플 파티 스케줄</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%237c5cff' d='M8 20 32 6l24 14v28L32 62 8 48z'/%3E%3Cpath fill='%23f9d663' d='M32 16l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z'/%3E%3C/svg%3E" />
  <style>
    :root{--bg:#090c1c;--panel:#12172d;--panel2:#1a2040;--line:#303962;--text:#f6f7ff;--muted:#aeb7d7;--violet:#8c72ff;--gold:#f7cb56;--green:#54d6aa;--danger:#ff7a91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#22295a 0,transparent 32rem),var(--bg);color:var(--text);font-family:Inter,"Noto Sans KR",system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:28px 30px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;gap:13px;align-items:center}.crest{display:grid;place-items:center;width:46px;height:46px;border:1px solid #a896ff;border-radius:14px;background:linear-gradient(135deg,#684cf1,#a784ff);font-size:25px;box-shadow:0 10px 25px #0005}.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--gold);font-weight:800}.brand h1{font-size:1.35rem;margin:2px 0 0}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--gold);color:#261d00}.secondary{background:#252d52;color:var(--text);border:1px solid #3a4576}.summary{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:linear-gradient(145deg,#181e3b,#11162a);border:1px solid var(--line);border-radius:16px;padding:17px}.next{position:relative;overflow:hidden}.next:after{content:"";position:absolute;inset:auto -35px -60px auto;width:150px;height:150px;border-radius:50%;background:#735bff22}.label{color:var(--muted);font-size:.83rem}.next strong{display:block;font-size:1.2rem;margin:8px 0 5px}.next span{color:#d8ddf5;font-size:.9rem}.metric b{display:block;font-size:1.75rem;margin-top:6px;color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:18px}.calendar,.side{background:var(--panel);border:1px solid var(--line);border-radius:18px}.calendar{padding:18px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.cal-head h2{font-size:1.12rem;margin:0}.month-nav{display:flex;gap:8px;align-items:center}.nav{width:32px;height:32px;border:1px solid #3a4576;border-radius:9px;background:#20284a;color:#fff;font-size:1.2rem;cursor:pointer}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays div{color:#8994bc;font-size:.75rem;font-weight:750;padding:0 9px 9px}.days{border-top:1px solid var(--line);border-left:1px solid var(--line)}.day{min-height:121px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px;background:#10152a}.day.muted{background:#0c1020;color:#697296}.date{font-size:.82rem;font-weight:750;display:flex;justify-content:space-between}.today .date span{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--gold);color:#241b00}.event{display:block;width:100%;text-align:left;margin-top:7px;border:0;border-left:3px solid var(--violet);border-radius:5px;padding:5px 6px;background:#252a54;color:#fff;font:inherit;font-size:.72rem;line-height:1.25;cursor:pointer}.event.hard{border-left-color:var(--gold);background:#463a22}.event .time{color:#bfc8ef;margin-right:3px}.side{padding:18px}.side h2{font-size:1rem;margin:1px 0 14px}.agenda{display:flex;flex-direction:column;gap:10px}.agenda-item{border-left:3px solid var(--violet);background:#1a2040;border-radius:0 10px 10px 0;padding:11px;cursor:pointer}.agenda-item.hard{border-left-color:var(--gold)}.agenda-date{font-size:.72rem;color:var(--gold);font-weight:800}.agenda-title{margin-top:4px;font-weight:800}.agenda-meta{font-size:.78rem;color:var(--muted);margin-top:3px}.legend{display:flex;gap:11px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:17px;padding-top:15px;font-size:.78rem;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--violet)}.dot.gold{background:var(--gold)}dialog{width:min(560px,calc(100% - 28px));border:1px solid #424d80;border-radius:18px;background:#151b35;color:var(--text);padding:0;box-shadow:0 20px 70px #0009}dialog::backdrop{background:#02040bbb}.modal{padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start}.modal h2{margin:0;font-size:1.25rem}.close{background:transparent;color:#ccd3ef;border:0;font-size:1.5rem;cursor:pointer}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.detail{background:#202749;border-radius:10px;padding:10px}.detail small{display:block;color:var(--muted);margin-bottom:4px}.members{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.member{padding:5px 8px;border-radius:20px;background:#2c3564;font-size:.8rem}.note{color:#c7cde7;background:#11162b;border-radius:10px;padding:12px;font-size:.9rem}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;color:#c8cfeb;font-size:.84rem}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #3a4576;background:#0e1328;color:#fff;border-radius:9px;padding:10px;font:inherit}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e7ffef;color:#092a18;padding:11px 16px;border-radius:12px;font-weight:750;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.summary{grid-template-columns:1fr 1fr}.next{grid-column:1/-1}.day{min-height:100px}}@media(max-width:620px){.app{padding:18px 12px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.summary{grid-template-columns:1fr}.next{grid-column:auto}.calendar{padding:11px}.weekdays div{padding:0 3px 7px;text-align:center}.day{min-height:78px;padding:5px}.event{font-size:.62rem;padding:4px}.event .time{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="app"><header class="top"><div class="brand"><div class="crest">⚔</div><div><div class="eyebrow">MAPLE BOSS SCHEDULE</div><h1>보스 집결지</h1></div></div><div class="actions"><button class="btn secondary" id="exportBtn">JSON 내보내기</button><button class="btn primary" id="addBtn">+ 약속 잡기</button></div></header>
  <section class="summary"><article class="card next"><div class="label">다음 출정</div><strong id="nextBoss">일정을 불러오는 중</strong><span id="nextInfo"></span></article><article class="card metric"><div class="label">이번 달 약속</div><b id="monthCount">0</b></article><article class="card metric"><div class="label">참가 인원</div><b id="memberCount">0명</b></article><article class="card metric"><div class="label">남은 자리</div><b id="seatCount">0자리</b></article></section>
  <section class="layout"><section class="calendar"><div class="cal-head"><h2 id="monthTitle">2026년 9월</h2><div class="month-nav"><button class="nav" id="prevBtn" aria-label="이전 달">‹</button><button class="btn secondary" id="todayBtn">오늘</button><button class="nav" id="nextBtn" aria-label="다음 달">›</button></div></div><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="calendarDays"></div><div class="legend"><span><i class="dot"></i>일반 난이도</span><span><i class="dot gold"></i>하드 난이도</span><span>일정을 누르면 상세 내용을 볼 수 있어요.</span></div></section><aside class="side"><h2>다가오는 약속</h2><div class="agenda" id="agenda"></div></aside></section></main>
  <dialog id="detailDialog"><div class="modal"><div class="modal-head"><div><div class="eyebrow" id="detailDate"></div><h2 id="detailTitle"></h2></div><button class="close" data-close aria-label="닫기">×</button></div><div class="details"><div class="detail"><small>출정 시간</small><b id="detailTime"></b></div><div class="detail"><small>파티장</small><b id="detailLeader"></b></div></div><div class="label">참가자 <span id="memberCapacity"></span></div><div class="members" id="detailMembers"></div><div class="note" id="detailNote"></div><div class="modal-actions"><button class="btn secondary" id="leaveBtn">내 이름으로 취소</button><button class="btn primary" id="joinBtn">참가하기</button></div></div></dialog>
  <dialog id="formDialog"><form class="modal" id="scheduleForm"><div class="modal-head"><div><div class="eyebrow">NEW BOSS RUN</div><h2>보스 약속 잡기</h2></div><button type="button" class="close" data-close aria-label="닫기">×</button></div><div class="form-grid" style="margin-top:18px"><label class="field">날짜<input name="date" type="date" required /></label><label class="field">시간<input name="time" type="time" value="21:00" required /></label><label class="field">보스<select name="boss"><option>검은 마법사</option><option>진 힐라</option><option>세렌</option><option>칼로스</option><option>스우</option><option>데미안</option><option>직접 입력</option></select></label><label class="field">난이도<select name="difficulty"><option>노멀</option><option>하드</option><option>카오스</option><option>익스트림</option></select></label><label class="field">파티장<input name="leader" placeholder="예: 아델왕" required /></label><label class="field">정원<input name="maxMembers" type="number" min="1" max="12" value="6" required /></label><label class="field full">메모<textarea name="note" rows="2" placeholder="스펙, 준비물, 공략 메모 등"></textarea></label></div><div class="modal-actions"><button class="btn secondary" type="button" data-close>취소</button><button class="btn primary" type="submit">약속 만들기</button></div></form></dialog><div class="toast" id="toast"></div>
<script>
const state={month:new Date(2026,8,1),schedules:[],selected:null};const $=s=>document.querySelector(s);const fmt=d=>new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date(d+'T00:00:00'));function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
async function load(){try{state.schedules=(await fetch('./data/schedules.json')).json?[]:[]}catch{}try{const data=await fetch('./data/schedules.json').then(r=>r.json());state.schedules=JSON.parse(localStorage.getItem('bossSchedules')||JSON.stringify(data.schedules))}catch{state.schedules=JSON.parse(localStorage.getItem('bossSchedules')||'[]')}render()}
function save(){localStorage.setItem('bossSchedules',JSON.stringify(state.schedules));render()}function key(d){return d.toISOString().slice(0,10)}function render(){const y=state.month.getFullYear(),m=state.month.getMonth();$('#monthTitle').textContent=`${y}년 ${m+1}월`;const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()), days=$('#calendarDays');days.innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let iso=key(d), events=state.schedules.filter(x=>x.date===iso),cls=d.getMonth()!==m?'muted':'';if(iso==='2026-09-29')cls+=' today';days.insertAdjacentHTML('beforeend',`<div class="day ${cls}"><div class="date"><span>${d.getDate()}</span></div>${events.map(e=>`<button class="event ${e.difficulty==='하드'?'hard':''}" data-id="${e.id}"><span class="time">${e.time}</span>${e.boss}</button>`).join('')}</div>`)}document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>detail(x.dataset.id));const inMonth=state.schedules.filter(x=>{let d=new Date(x.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m});$('#monthCount').textContent=inMonth.length;$('#memberCount').textContent=inMonth.reduce((a,x)=>a+x.members.length,0)+'명';$('#seatCount').textContent=inMonth.reduce((a,x)=>a+x.maxMembers-x.members.length,0)+'자리';const upcoming=[...state.schedules].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const n=upcoming[0];$('#nextBoss').textContent=n?`${n.boss} · ${n.difficulty}`:'등록된 약속 없음';$('#nextInfo').textContent=n?`${fmt(n.date)} ${n.time} · ${n.members.length}/${n.maxMembers}명 집결`:'새 약속을 만들어 보세요.';$('#agenda').innerHTML=upcoming.slice(0,5).map(x=>`<article class="agenda-item ${x.difficulty==='하드'?'hard':''}" data-id="${x.id}"><div class="agenda-date">${fmt(x.date)} · ${x.time}</div><div class="agenda-title">${x.boss} <span style="color:#c6cfef;font-size:.78rem">${x.difficulty}</span></div><div class="agenda-meta">${x.members.length}/${x.maxMembers}명 · 파티장 ${x.leader}</div></article>`).join('')||'<p class="label">아직 약속이 없어요.</p>';document.querySelectorAll('.agenda-item').forEach(x=>x.onclick=()=>detail(x.dataset.id))}
function detail(id){state.selected=state.schedules.find(x=>x.id===id);let e=state.selected;$('#detailDate').textContent=fmt(e.date);$('#detailTitle').textContent=`${e.boss} · ${e.difficulty}`;$('#detailTime').textContent=e.time;$('#detailLeader').textContent=e.leader;$('#memberCapacity').textContent=`${e.members.length}/${e.maxMembers}`;$('#detailMembers').innerHTML=e.members.map(x=>`<span class="member">${x}</span>`).join('');$('#detailNote').textContent=e.note||'등록된 메모가 없어요.';$('#joinBtn').disabled=e.members.length>=e.maxMembers;$('#joinBtn').textContent=e.members.length>=e.maxMembers?'파티 정원 마감':'참가하기';$('#detailDialog').showModal()}
$('#addBtn').onclick=()=>{$('#scheduleForm').reset();$('#scheduleForm [name=date]').value=key(new Date());$('#formDialog').showModal()};$('#prevBtn').onclick=()=>{state.month.setMonth(state.month.getMonth()-1);render()};$('#nextBtn').onclick=()=>{state.month.setMonth(state.month.getMonth()+1);render()};$('#todayBtn').onclick=()=>{state.month=new Date(2026,8,1);render()};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('dialog').close());$('#scheduleForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.boss==='직접 입력')f.boss=prompt('보스 이름을 입력하세요.')||'미정';f.id='boss-'+Date.now();f.maxMembers=Number(f.maxMembers);f.members=[f.leader];state.schedules.push(f);save();$('#formDialog').close();toast('새 보스 약속을 달력에 등록했어요!')};$('#joinBtn').onclick=()=>{let n=prompt('참가자 이름을 입력하세요.');if(!n)return;if(state.selected.members.includes(n))return toast('이미 참가 중인 이름이에요.');state.selected.members.push(n);save();detail(state.selected.id);toast(`${n}님이 파티에 참가했어요!`)};$('#leaveBtn').onclick=()=>{let n=prompt('취소할 참가자 이름을 입력하세요.');if(!n)return;let i=state.selected.members.indexOf(n);if(i<0)return toast('참가자 목록에서 찾지 못했어요.');state.selected.members.splice(i,1);save();detail(state.selected.id);toast(`${n}님을 파티에서 제외했어요.`)};$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({schedules:state.schedules},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='schedules.json';a.click();URL.revokeObjectURL(a.href);toast('현재 약속 데이터를 JSON으로 내려받았어요.')};load();
</script></body></html>
